spring.application.name=eic

server.port=3100
server.servlet.context-path=/


# sessions
server.servlet.session.timeout=10m


# GMAIL smtp mail properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL}
spring.mail.password=${EMAIL_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com


# connect to local db
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/eq-inventory
spring.datasource.username=${LOCAL_PG_USER}
spring.datasource.password=${LOCAL_PG_PASSWORD}


