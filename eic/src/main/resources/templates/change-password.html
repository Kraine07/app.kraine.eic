<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password</title>
  <style th:replace="~{dashboard :: styles}"></style>
  <style>
    .brandbar { padding: .75rem 1.5rem; background: #fff; border-bottom: 1px solid var(--line); font-weight: 700; }
    main.narrow { max-width: 34rem; }
    input[type=password] { width: 100%; padding: .55rem .65rem; font-size: 1rem;
                           border: 1px solid #8a93a0; border-radius: 4px; background: #fff; }
    input[type=password].invalid { border-color: var(--danger); background: #fdf3f2; }
    .inline-form { display: inline; margin: 0; }
  </style>
</head>
<body>
<div class="brandbar">Equipment Inventory</div>

<main class="narrow">
  <h1>Change password</h1>

  <div class="banner note" role="status" th:if="${required}">
    Your password is temporary. Choose a new password to continue.
  </div>

  <form class="panel" method="post" th:action="@{/change-password}" th:object="${changePasswordForm}" novalidate>
    <div class="field">
      <label for="currentPassword" th:text="${required} ? 'Temporary password' : 'Current password'">Current password</label>
      <input type="password" id="currentPassword" th:field="*{currentPassword}" autocomplete="current-password"
             th:classappend="${#fields.hasErrors('currentPassword')} ? 'invalid'">
      <p class="error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></p>
    </div>

    <div class="field">
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" th:field="*{newPassword}" autocomplete="new-password"
             aria-describedby="passwordRule" th:classappend="${#fields.hasErrors('newPassword')} ? 'invalid'">
      <p class="hint" id="passwordRule" th:text="${passwordRule}">Password rule</p>
      <p class="error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" th:field="*{confirmPassword}" autocomplete="new-password"
             th:classappend="${#fields.hasErrors('confirmPassword')} ? 'invalid'">
      <p class="error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
    </div>

    <div class="form-actions">
      <button type="submit">Change Password</button>
      <a class="button secondary" th:unless="${required}" th:href="@{/equipment}">Cancel</a>
    </div>
  </form>

  <!-- A user who must change the password can still leave. -->
  <form class="inline-form" th:if="${required}" method="post" th:action="@{/logout}" style="margin-top:1rem; display:block;">
    <button type="submit" class="linklike">Sign out</button>
  </form>
</main>
</body>
</html>
