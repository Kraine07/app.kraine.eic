<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Region Management</title>
  <style th:replace="~{dashboard :: styles}"></style>
</head>
<body>
<header th:replace="~{dashboard :: topbar}"></header>

<main>
  <div class="page-head">
    <h1>Region Management</h1>
    <a class="button" th:href="@{/regions/new}">Create Region</a>
  </div>

  <div class="banner success" role="status" th:if="${successMessage}" th:text="${successMessage}"></div>
  <div class="banner error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

  <label for="filter" class="hint">Filter regions</label>
  <input type="text" id="filter" class="filter" placeholder="Name">

  <p th:if="${#lists.isEmpty(regions)}">No regions yet.</p>

  <div class="table-wrap" th:unless="${#lists.isEmpty(regions)}">
    <table id="regionTable">
      <thead>
        <tr><th>Name</th><th>Actions</th></tr>
      </thead>
      <tbody>
        <tr th:each="r : ${regions}">
          <td th:text="${r.name()}">North</td>
          <td>
            <div class="actions">
              <a class="button secondary" th:href="@{/regions/{id}/edit(id=${r.id()})}">Edit</a>
              <button type="button" class="danger"
                      data-confirm-form="deleteForm"
                      th:data-action="@{/regions/{id}/delete(id=${r.id()})}"
                      data-confirm-title="Delete this region?"
                      th:data-confirm-message="'Delete ' + ${r.name()} + '? This cannot be undone.'"
                      data-confirm-label="Yes">Delete</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Posted by the confirmation window; the button supplies the URL. -->
  <form id="deleteForm" method="post" th:action="@{/regions}"></form>
</main>

<dialog th:replace="~{dashboard :: confirmDialog}"></dialog>
<script th:replace="~{dashboard :: confirmScript}"></script>
<script>
  document.getElementById('filter').addEventListener('input', function (event) {
    var text = event.target.value.toLowerCase();
    document.querySelectorAll('#regionTable tbody tr').forEach(function (row) {
      row.hidden = text !== '' && row.textContent.toLowerCase().indexOf(text) === -1;
    });
  });
</script>
</body>
</html>
