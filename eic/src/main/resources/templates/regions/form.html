<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${editing} ? 'Update Region' : 'Create Region'">Region</title>
  <style th:replace="~{dashboard :: styles}"></style>
</head>
<body>
<header th:replace="~{dashboard :: topbar}"></header>

<main>
  <h1 th:text="${editing} ? 'Update Region' : 'Create Region'">Create Region</h1>

  <form class="panel" method="post" novalidate
        th:action="${editing} ? @{/regions/{id}(id=${regionId})} : @{/regions}" th:object="${regionForm}">

    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" th:field="*{name}" autocomplete="off" autofocus
             th:classappend="${#fields.hasErrors('name')} ? 'invalid'">
      <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
    </div>

    <div class="form-actions">
      <button type="submit">Submit</button>
      <a class="button secondary" th:href="@{/regions}">Cancel</a>
    </div>
  </form>
</main>
</body>
</html>
