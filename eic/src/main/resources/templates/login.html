<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1b1f24; background: #f6f7f9; }
    main { max-width: 26rem; margin: 4rem auto; padding: 0 1rem; }
    form { background: #fff; border: 1px solid #d5d9df; border-radius: 6px; padding: 1.5rem; }
    .field { margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: .35rem; }
    input[type=email], input[type=password] {
      width: 100%; box-sizing: border-box; padding: .55rem .65rem; font-size: 1rem;
      border: 1px solid #8a93a0; border-radius: 4px; }
    input.invalid { border-color: #c62828; background: #fdf3f2; }
    .error { color: #b3261e; font-size: .9rem; margin: .3rem 0 0; }
    .banner { padding: .75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
    .banner.error-banner { background: #fdecea; border: 1px solid #c62828; color: #7f1d1d; }
    .banner.ok { background: #e8f5e9; border: 1px solid #2e7d32; color: #1b4d1f; }
    button { background: #0b5cad; color: #fff; border: 0; border-radius: 4px;
             padding: .6rem 1.25rem; font-size: 1rem; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #f2b300; outline-offset: 2px; }
  </style>
</head>
<body>
<main>
  <h1>Sign in</h1>

  <div class="banner ok" role="status" th:if="${successMessage}" th:text="${successMessage}"></div>
  <div class="banner ok" role="status" th:if="${infoMessage}" th:text="${infoMessage}"></div>
  <div class="banner error-banner" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

  <form th:action="@{/login}" th:object="${loginForm}" method="post" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" th:field="*{email}" autocomplete="username" autofocus
             th:classappend="${#fields.hasErrors('email')} ? 'invalid'">
      <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" th:field="*{password}" autocomplete="current-password"
             th:classappend="${#fields.hasErrors('password')} ? 'invalid'">
      <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
    </div>

    <button type="submit">Sign In</button>
  </form>
</main>
</body>
</html>
