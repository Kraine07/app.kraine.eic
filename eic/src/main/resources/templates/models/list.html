<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Model Management</title>
  <style th:replace="~{dashboard :: styles}"></style>
</head>
<body>
<header th:replace="~{dashboard :: topbar}"></header>

<main>
  <div class="page-head">
    <h1>Model Management</h1>
    <a class="button" th:href="@{/models/new}">Create Model</a>
  </div>

  <div class="banner success" role="status" th:if="${successMessage}" th:text="${successMessage}"></div>
  <div class="banner error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

  <label for="filter" class="hint">Filter models</label>
  <input type="text" id="filter" class="filter" placeholder="Manufacturer or description">

  <p th:if="${#lists.isEmpty(models)}">No models yet.</p>

  <div class="table-wrap" th:unless="${#lists.isEmpty(models)}">
    <table id="modelTable">
      <thead>
        <tr><th>Manufacturer</th><th>Description</th><th>Actions</th></tr>
      </thead>
      <tbody>
        <tr th:each="m : ${models}">
          <td th:text="${m.manufacturerName()}">Acme</td>
          <td th:text="${m.description()}">X100</td>
          <td>
            <div class="actions">
              <a class="button secondary"
                th:href="@{/models/edit(manufacturerId=${m.manufacturerId()},description=${m.description()})}">Edit</a>
              <button type="button" class="danger"
                      data-confirm-form="deleteForm"
                      th:data-action="@{/models/delete(manufacturerId=${m.manufacturerId()},description=${m.description()})}"
                      data-confirm-title="Delete this model?"
                      th:data-confirm-message="'Delete ' + ${m.description()} + ' from ' + ${m.manufacturerName()} + '? This cannot be undone.'"
                      data-confirm-label="Yes">Delete</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Posted by the confirmation window; the button supplies the URL and the model it names. -->
  <form id="deleteForm" method="post" th:action="@{/models}"></form>
</main>

<dialog th:replace="~{dashboard :: confirmDialog}"></dialog>
<script th:replace="~{dashboard :: confirmScript}"></script>
<script>
  document.getElementById('filter').addEventListener('input', function (event) {
    var text = event.target.value.toLowerCase();
    document.querySelectorAll('#modelTable tbody tr').forEach(function (row) {
      row.hidden = text !== '' && row.textContent.toLowerCase().indexOf(text) === -1;
    });
  });
</script>
</body>
</html>
